<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps von Hoebelje</title>
<style>
:root{--bg:#f2f2f2;--sf:#fff;--fg:#111;--mu:#666;--bd:#1f1f1f;--ac:#3b6ff5}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--sf:#1f1f1f;--fg:#f2f2f2;--mu:#a0a0a0;--bd:#d8d8d8;--ac:#8aa4ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:8px 0 20px}
a.app{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sf);color:inherit;text-decoration:none;border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
a.app b{display:block;font-size:18px}a.app span{color:var(--mu);font-size:14px}a.app i{color:var(--ac);font-style:normal;font-size:22px}
a.app:active{background:var(--ac);color:#fff}
</style></head><body><main>
<h1>Apps</h1>
<a class="app" href="turnierplaner/"><div><b>Agrippina Turnierplaner</b><span>Turniere planen und Ergebnisse eintragen</span></div><i>→</i></a>
</main></body></html>
